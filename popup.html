<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Art Collector</title><link rel="stylesheet" href="popup.css"><script src="core.js" defer></script><script src="popup.js" defer></script></head>
<body>
  <header><div><p class="eyebrow">X ART COLLECTOR</p><h1>收藏画师原图</h1></div><span class="tag">本地收藏</span></header>
  <main>
    <section>
      <h2>历史图片</h2>
      <form id="history-form">
        <label for="artist">画师账号</label>
        <div class="input-row"><span>@</span><input id="artist" autocomplete="off" maxlength="15" placeholder="artist_handle" required aria-describedby="artist-help"></div>
        <p id="artist-help" class="hint">打开画师主页时自动填入，也可手动输入。</p>
        <div class="dates"><label>从<input id="from" type="date"></label><label>到<input id="through" type="date"></label></div>
        <p class="hint">日期按电脑时区；留空获取全部可访问历史。仅收集原创静态图片。</p>
        <label class="check"><input id="force" type="checkbox">重新下载已保存图片（用于补回手动删除的文件）</label>
        <button class="primary" type="submit">开始收藏原图</button>
      </form>
      <button id="toggle-watch" class="secondary" disabled>+ 追踪每日更新</button>
      <p class="hint">追踪从开启时算起，不会立刻下载旧图。每天首次启动 Chrome 时自动下载新图，也可点击“立即检查 / 重试”。失败后手动重试。</p>
    </section>
    <p id="notice" role="status" aria-live="polite"></p>
    <section><div class="section-heading"><h2>每日追踪</h2><span id="watch-count" class="muted"></span></div><p id="auto-status" class="hint"></p><div id="watches"></div></section>
    <section><div class="section-heading"><h2>任务与失败记录</h2><button id="clear-records" class="text-button">清空显示记录</button></div><div class="actions"><button id="show-archive" class="text-button">查看后台记录</button><button id="export-log" class="text-button">导出记录</button></div><p class="hint">清空只隐藏记录；后台保留每日检查、去重和失败重试状态。运行中的任务继续执行。</p><div id="jobs"></div></section>
    <section><h2>换电脑备份</h2><p class="hint">导出追踪名单、检查时间和已下载索引。图片文件请另行复制到新电脑；导入不会恢复登录或运行中的任务。</p><div class="actions"><button id="export-backup" class="text-button">导出迁移备份</button><button id="import-backup" class="text-button">导入迁移备份</button></div><input id="backup-file" type="file" accept="application/json,.json" hidden></section>
  </main>
  <footer><span>保存位置：下载 / X-Art / 画师账号</span><button id="downloads" class="text-button">打开下载记录 ↗</button></footer>
</body></html>
